name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint, formatting, contrast, content rules, server and client tests, production build
      - run: npm run verify
      # The production dependency tree must stay free of known vulnerabilities.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      NODE_ENV: development
      PORT: 4000
      LOG_LEVEL: warn
      JWT_ACCESS_SECRET: ci-secret-that-is-long-enough-for-validation-0123456789
      CORS_ORIGINS: http://localhost:4000
      DATABASE_URL: file:./ci.db
      UPLOAD_DIR: ./ci-uploads
      CLIENT_DIST_DIR: ../client/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:4000/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run smoke test
        run: BASE_URL=http://localhost:4000 node e2e/smoke.mjs
